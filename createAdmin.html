<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Create Admin User</title>
  <style>
    body {
      padding: 20px;
      font-family: Arial, sans-serif;
    }

    .success {
      color: green;
    }

    .error {
      color: red;
    }

    pre {
      background: #f5f5f5;
      padding: 10px;
    }
  </style>
</head>

<body>
  <h1>Create Admin User</h1>
  <div id="status"></div>
  <script>
    // Chaves do Smash Burger: carrinho, sessão, cadastro e admin. As outras chaves da origem ficam como estão.
    const APP_KEYS = ['smash-burger:cart:v1', 'smash-burger:session', 'smash-burger:account', 'admin'];

    // Cadastro no formato antigo, em `user` (com email e password): o app o migraria de volta para o cadastro.
    // Em outro formato, a chave não é do Smash Burger e fica.
    function removeLegacyAccount() {
      try {
        const legacy = JSON.parse(localStorage.getItem('user'));
        if (legacy && typeof legacy === 'object' && 'email' in legacy && 'password' in legacy) {
          localStorage.removeItem('user');
        }
      } catch (error) {
        // Não é JSON: não é o cadastro antigo
      }
    }

    function createAdmin() {
      APP_KEYS.forEach((key) => localStorage.removeItem(key));
      removeLegacyAccount();

      const adminUser = {
        firstName: 'Admin',
        lastName: 'User',
        email: 'admin@example.com',
        password: 'Demo1234',
        role: 'admin'
      };

      try {
        localStorage.setItem('admin', JSON.stringify(adminUser));

        const savedAdmin = localStorage.getItem('admin');
        const parsedAdmin = JSON.parse(savedAdmin);

        if (parsedAdmin && parsedAdmin.email === adminUser.email) {
          document.getElementById('status').innerHTML = `
                        <h3 class="success">✅ Admin criado com sucesso!</h3>
                        <p><strong>Dados salvos:</strong></p>
                        <pre>${JSON.stringify(parsedAdmin, null, 2)}</pre>
                        <p><strong>Próximos passos:</strong></p>
                        <ol>
                            <li>Verifique os dados acima</li>
                            <li>Acesse: <a href="/admin/login">Login Admin</a></li>
                            <li>Use as credenciais:</li>
                            <ul>
                                <li>Email: ${adminUser.email}</li>
                                <li>Senha: ${adminUser.password}</li>
                            </ul>
                        </ol>
                    `;
        } else {
          throw new Error('Falha na verificação dos dados salvos');
        }
      } catch (error) {
        document.getElementById('status').innerHTML = `
                    <h3 class="error">❌ Erro ao criar admin:</h3>
                    <p>${error.message}</p>
                `;
      }
    }

    createAdmin();
  </script>
</body>

</html>

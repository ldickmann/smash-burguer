name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # ou master, dependendo da sua branch principal
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # O yarn.lock e o .yarn/cache são do Yarn 3: o Corepack roda essa versão e
      # instala exatamente o que está no lockfile (o Yarn 1 do runner o ignorava
      # e resolvia tudo de novo a cada deploy)
      - name: Install dependencies
        run: corepack yarn@3.8.7 install --immutable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

      - name: Build
        run: corepack yarn@3.8.7 build
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

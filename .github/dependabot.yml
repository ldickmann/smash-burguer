# Atualiza as GitHub Actions do deploy.yml, fixadas por SHA: o Dependabot troca o
# SHA e o comentário de versão juntos. As PRs vão para a develop, como as demais.
# As security updates do Dependabot, se ligadas, vão sempre para a main
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    # Só propõe uma versão depois de 7 dias publicada
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - '*'
    commit-message:
      prefix: ci
      include: scope
